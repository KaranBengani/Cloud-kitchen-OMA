# Render Blueprint for the API (DECISIONS.md D2). Render → New → Blueprint → pick this repo.
# Secrets marked `sync: false` are typed into the Render dashboard once and never live in git.
services:
  - type: web
    name: oma-api
    runtime: node
    plan: free
    region: singapore # closest Render region to India
    branch: main
    rootDir: .
    buildCommand: npm ci -w api --include=dev && npm run build -w api # skips the Expo app's packages
    # Migrations run on every start: free instances have no pre-deploy step, and
    # migration:run is a no-op when nothing is pending.
    startCommand: npm run migration:run -w api && node apps/api/dist/main.js
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.13.1
      - key: DATABASE_URL # Neon connection string, with ?sslmode=require
        sync: false
      - key: AUTH_PIN # the family's 6-digit PIN
        sync: false
      - key: JWT_SECRET
        generateValue: true # Render generates a random 256-bit value

  # Staging: same code, its own Neon branch ("staging") and PIN. Used by the
  # "Mummy's Kitchen (Test)" app so testing never touches real orders.
  # Not kept awake (no keep-alive ping), so it sleeps when idle and barely uses free hours;
  # the first request after a sleep takes about a minute.
  # Deploys from the `staging` branch: feature PRs merge there first and are tested in the Test app,
  # then `staging` merges into `main` for production (DECISIONS.md D20).
  - type: web
    name: oma-api-stg
    runtime: node
    plan: free
    region: singapore
    branch: staging
    rootDir: .
    buildCommand: npm ci -w api --include=dev && npm run build -w api
    startCommand: npm run migration:run -w api && node apps/api/dist/main.js
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.13.1
      - key: DATABASE_URL # Neon "staging" branch connection string
        sync: false
      - key: AUTH_PIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
